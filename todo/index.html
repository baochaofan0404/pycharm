<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个轻量、响应式、支持本地持久化的 Todo 应用。">
  <title>Todo — 我的任务</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 transition-colors dark:bg-slate-950 dark:text-slate-100">
  <main class="mx-auto min-h-screen w-full max-w-4xl px-4 py-8 sm:px-6 lg:py-14">
    <header class="mb-8 flex items-center justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600 dark:text-indigo-400">Todo</p>
        <h1 class="mt-1 text-3xl font-bold tracking-tight sm:text-4xl">我的任务</h1>
        <p id="summary" class="mt-2 text-sm text-slate-500 dark:text-slate-400">准备开始今天的计划。</p>
      </div>
      <button id="themeToggle" class="icon-button" type="button" aria-label="切换深色模式" title="切换深色模式">☾</button>
    </header>

    <section class="rounded-3xl bg-white p-4 shadow-xl shadow-slate-200/50 dark:bg-slate-900 dark:shadow-black/20 sm:p-6">
      <form id="taskForm" class="flex flex-col gap-3 sm:flex-row">
        <input id="taskInput" class="text-input flex-1" type="text" maxlength="200" autocomplete="off" placeholder="添加一个新任务…" aria-label="任务内容" required>
        <button class="primary-button" type="submit">添加任务</button>
      </form>

      <div class="mt-6 flex flex-col gap-3 border-b border-slate-200 pb-4 dark:border-slate-800 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex flex-wrap gap-2" role="tablist" aria-label="任务筛选">
          <button class="filter-button active" data-filter="all" type="button">全部</button>
          <button class="filter-button" data-filter="active" type="button">进行中</button>
          <button class="filter-button" data-filter="completed" type="button">已完成</button>
        </div>
        <div class="flex gap-2">
          <input id="searchInput" class="text-input h-10 w-full sm:w-52" type="search" placeholder="搜索任务…" aria-label="搜索任务">
          <button id="clearCompleted" class="secondary-button whitespace-nowrap" type="button">清除已完成</button>
        </div>
      </div>

      <div id="emptyState" class="hidden py-16 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-50 text-2xl dark:bg-indigo-950">✓</div>
        <h2 class="font-semibold">这里还没有任务</h2>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">添加一个任务，开始行动吧。</p>
      </div>

      <ul id="taskList" class="mt-4 space-y-3" aria-live="polite"></ul>
    </section>

    <footer class="mt-5 text-center text-xs text-slate-400">数据保存在当前浏览器的本地存储中，不需要服务器。</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
